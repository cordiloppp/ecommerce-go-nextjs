services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://app:app@db:5432/ecommerce?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: "dev-super-secret-change-me"
      JWT_TTL_HOURS: "24"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      # El puerto del host es 8088 (el 8080 suele estar ocupado); dentro del
      # contenedor el servicio sigue en 8080.
      - "8088:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      # URL del backend visible desde el navegador del usuario
      NEXT_PUBLIC_API_URL: "http://localhost:8088"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
